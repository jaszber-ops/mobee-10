<!DOCTYPE html>
<html>
<head>
    <title>Simple PartyKit Test</title>
</head>
<body>
    <h1>PartyKit Connection Test</h1>
    <div id="status">Initializing...</div>
    <pre id="log"></pre>

    <script type="module">
        const log = document.getElementById('log');
        const status = document.getElementById('status');

        function addLog(msg) {
            log.textContent += new Date().toLocaleTimeString() + ': ' + msg + '\n';
            console.log(msg);
        }

        // Import PartySocket as ES module
        import PartySocket from "https://cdn.jsdelivr.net/npm/partysocket@1.0.0/+esm";

        addLog("PartySocket loaded: " + typeof PartySocket);

        status.textContent = "Connecting...";

        const ws = new PartySocket({
            host: "localhost:1999",
            room: "test-room"
        });

        ws.addEventListener("open", () => {
            status.textContent = "✅ CONNECTED!";
            status.style.color = "green";
            addLog("WebSocket OPENED!");
        });

        ws.addEventListener("message", (event) => {
            addLog("Received: " + event.data);
        });

        ws.addEventListener("error", (err) => {
            status.textContent = "❌ Error";
            status.style.color = "red";
            addLog("ERROR: " + JSON.stringify(err));
        });

        ws.addEventListener("close", () => {
            status.textContent = "❌ Disconnected";
            addLog("WebSocket CLOSED");
        });

        // Auto-send test message after 1 second
        setTimeout(() => {
            if (ws.readyState === WebSocket.OPEN) {
                addLog("Sending test message...");
                ws.send("Hello PartyKit!");
            } else {
                addLog("WebSocket not open. ReadyState: " + ws.readyState);
            }
        }, 1000);
    </script>
</body>
</html>
