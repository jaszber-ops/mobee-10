<!DOCTYPE html>
<html>
<head>
    <title>PartyKit Test</title>
    <script src="https://unpkg.com/partysocket/dist/index.js"></script>
</head>
<body>
    <h1>PartyKit Connection Test</h1>
    <div id="status">Connecting...</div>
    <button onclick="testSend()">Send Test Message</button>
    <pre id="log"></pre>

    <script>
        const log = document.getElementById('log');
        const status = document.getElementById('status');
        
        function addLog(msg) {
            log.textContent += new Date().toLocaleTimeString() + ': ' + msg + '\n';
            console.log(msg);
        }

        const conn = new PartySocket({
            host: "localhost:1999",
            room: "test-room"
        });

        conn.addEventListener("open", () => {
            status.textContent = "✅ Connected!";
            status.style.color = "green";
            addLog("WebSocket OPENED");
        });

        conn.addEventListener("message", (event) => {
            addLog("Received: " + event.data);
        });

        conn.addEventListener("error", (err) => {
            status.textContent = "❌ Error";
            status.style.color = "red";
            addLog("ERROR: " + err);
        });

        conn.addEventListener("close", () => {
            status.textContent = "❌ Disconnected";
            status.style.color = "red";
            addLog("WebSocket CLOSED");
        });

        function testSend() {
            addLog("Sending START_GAME...");
            conn.send(JSON.stringify({ type: "START_GAME" }));
        }
    </script>
</body>
</html>
